<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 630" role="img" aria-labelledby="title desc">
  <title id="title">Yong Dai research system</title>
  <desc id="desc">Four connected research areas in foundation models, multimodal intelligence, agentic reasoning, and embodied intelligence converge toward interactive world models.</desc>
  <defs>
    <style>
      .sans { font-family: "DM Sans", Arial, sans-serif; }
      .serif { font-family: "Source Serif 4", Georgia, serif; }
      .mono { font-family: "IBM Plex Mono", Monaco, monospace; }
      .ink { fill: #424846; }
      .muted { fill: #7b817e; }
      .accent { fill: #788c80; }
      .line { stroke: #d5d4ce; }
      .connector { fill: none; stroke: #a8afa9; stroke-width: 1.5; }
      .node { fill: #f7f6f2; stroke: #d5d4ce; stroke-width: 1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#788c80"/>
    </marker>
  </defs>

  <rect width="800" height="630" fill="#f1f0ec"/>
  <path d="M32 32h18M32 32v18M768 32h-18M768 32v18M32 598h18M32 598v-18M768 598h-18M768 598v-18" class="line" fill="none"/>

  <text x="48" y="64" class="mono accent" font-size="11" font-weight="500">RESEARCH SYSTEM / 2026</text>
  <text x="48" y="102" class="serif ink" font-size="30" font-weight="600">From perception to situated intelligence</text>
  <text x="48" y="128" class="sans muted" font-size="13">A unified research program for models that understand, reason, act, and learn.</text>

  <rect x="48" y="166" width="336" height="132" rx="4" class="node"/>
  <rect x="416" y="166" width="336" height="132" rx="4" class="node"/>
  <rect x="48" y="326" width="336" height="132" rx="4" class="node"/>
  <rect x="416" y="326" width="336" height="132" rx="4" class="node"/>

  <rect x="48" y="166" width="5" height="132" fill="#788c80"/>
  <rect x="416" y="166" width="5" height="132" fill="#7e909c"/>
  <rect x="48" y="326" width="5" height="132" fill="#a08e82"/>
  <rect x="416" y="326" width="5" height="132" fill="#978a96"/>

  <text x="72" y="194" class="mono accent" font-size="10">R01 / REPRESENT</text>
  <text x="72" y="226" class="serif ink" font-size="21" font-weight="600">Foundation Models</text>
  <text x="72" y="252" class="sans muted" font-size="12.5">Pre-training · Alignment · Adaptation</text>
  <text x="72" y="276" class="sans ink" font-size="12.5">Build general and transferable intelligence.</text>

  <text x="440" y="194" class="mono" fill="#7e909c" font-size="10">R02 / PERCEIVE</text>
  <text x="440" y="226" class="serif ink" font-size="21" font-weight="600">Multimodal Intelligence</text>
  <text x="440" y="252" class="sans muted" font-size="12.5">Language · Vision · Audio · Omni-modal</text>
  <text x="440" y="276" class="sans ink" font-size="12.5">Ground reasoning across sensory signals.</text>

  <text x="72" y="354" class="mono" fill="#a08e82" font-size="10">R03 / REASON + ACT</text>
  <text x="72" y="386" class="serif ink" font-size="21" font-weight="600">Agentic Reasoning</text>
  <text x="72" y="412" class="sans muted" font-size="12.5">Web agents · Retrieval · Tool use</text>
  <text x="72" y="436" class="sans ink" font-size="12.5">Turn knowledge into deliberate action.</text>

  <text x="440" y="354" class="mono" fill="#978a96" font-size="10">R04 / INTERACT</text>
  <text x="440" y="386" class="serif ink" font-size="21" font-weight="600">Embodied Intelligence</text>
  <text x="440" y="412" class="sans muted" font-size="12.5">Spatial reasoning · VLA · Embodied brain</text>
  <text x="440" y="436" class="sans ink" font-size="12.5">Learn through physical-world interaction.</text>

  <path d="M216 298v14h184M584 298v14H400M216 458v22h184M584 458v22H400v24" class="connector"/>
  <circle cx="400" cy="312" r="4" fill="#788c80"/>
  <circle cx="400" cy="480" r="4" fill="#788c80"/>
  <path d="M400 480v26" class="connector" marker-end="url(#arrow)"/>

  <rect x="152" y="514" width="496" height="76" rx="4" fill="#59635f"/>
  <text x="176" y="543" class="mono" fill="#c7d0ca" font-size="10">CONVERGENCE / WORLD MODEL</text>
  <text x="176" y="571" class="serif" fill="#f1f0ec" font-size="22" font-weight="600">Interactive World Models</text>
  <text x="624" y="559" class="mono" fill="#c7d0ca" font-size="10" text-anchor="end">PERCEIVE</text>
  <text x="624" y="574" class="mono" fill="#c7d0ca" font-size="10" text-anchor="end">REASON · ACT · LEARN</text>
</svg>
