<div class="author-mark" aria-hidden="true">YD</div>
<div class="author-details">
  <p class="author-name">{{ site.owner.name }}</p>
  <p class="author-role">AI Researcher</p>
  <div class="author-links">
    {% if site.owner.email %}<a href="mailto:{{ site.owner.email }}"><i class="icon-mail" aria-hidden="true"></i> Email</a>{% endif %}
    {% if site.owner.scholar %}<a href="{{ site.owner.scholar }}"><i class="ai ai-google-scholar-square" aria-hidden="true"></i> Scholar</a>{% endif %}
    {% if site.owner.github %}<a href="https://github.com/{{ site.owner.github }}"><i class="icon-github" aria-hidden="true"></i> GitHub</a>{% endif %}
  </div>
</div>
